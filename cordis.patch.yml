# ============================================================================
# dsh-maze 的 bundle 补丁层（组合层）
# ============================================================================
# package.json 的 dsh.bundle.patch 指向本文件；dsh 装载 profile 时把它叠加进
# 插件组合表，再按每行 name 去 import 对应模块并作为 Cordis 插件挂载。
#
# ⚠️ 行的 name 必须是【裸包名】dsh-maze：dsh-web 的客户端模块扫描只解析
# 裸包名行——靠这行找到本包 package.json 的 `dsh.client` 字段，才会把
# client/client.js（Maze 前端）服务给网页（先例：dsh-tabbit 的同款注释）。
- insert:
    - id: dsh-maze
      name: dsh-maze
      config:
        rules:
          # 默认规则即用户的第一个需求：14:00–18:00 高消耗时段用 GLM 系模型
          # 时提醒额度消耗快、建议切换。message 里的 {model}/{provider} 由
          # 宿主半边在触发时替换。
          - id: glm-peak-hours
            message: >-
              当前模型 {model}（{provider}）处于 14:00–18:00 高消耗时段，
              GLM 额度消耗会明显加快，建议切换至其他模型。
            startHour: 14
            endHour: 18
            modelPattern: '*glm*'
            maxPerDay: 2
            cooldownMinutes: 120
